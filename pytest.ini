[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep the default run offline and fast. Coverage is opt-in so a plain
# `pytest` stays quick during development:
#   pytest --cov=src --cov=api --cov-report=term-missing
addopts = -q --strict-markers

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
